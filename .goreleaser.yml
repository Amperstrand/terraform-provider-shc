version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    binary: terraform-provider-shc_v{{ .Version }}

archives:
  - formats: [zip]
    name_template: "terraform-provider-shc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "terraform-provider-shc_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

release:
  draft: false

changelog:
  disable: true
