---
# Release automation: tag push (v*) → test → GoReleaser → GitHub Release.
# Builds the same matrix the README documents (linux/darwin × amd64/arm64),
# attaches SHA256SUMS. CHANGELOG.md stays the release-notes source; the
# GoReleaser changelog is disabled in .goreleaser.yml.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go test ./... -count=1
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
