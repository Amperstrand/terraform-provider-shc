---
name: Scheduled Acceptance Tests

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clone shc-toolkit
        run: git clone --depth=1 https://github.com/Amperstrand/shc-toolkit.git ../shc-toolkit
      - name: Install shc-toolkit
        run: pip install -e .
        working-directory: ../shc-toolkit
      - name: Run acceptance tests
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
          TF_ACC: "1"
        run: go test ./provider/ -run 'TestAccVMResource_Basic$|TestAccVMResource_Import$|TestAccFirewallRuleResource_Basic$|TestAccSnapshotResource_Basic$' -v -timeout 20m
      - name: Reap orphaned VMs
        if: always()
        env:
          SHC_API_KEY: ${{ secrets.SHC_API_KEY }}
        run: |
          python3 - << 'PY'
          from shc_toolkit.client import SHCClient
          import os
          c = SHCClient(api_key=os.environ["SHC_API_KEY"])
          orphans = c.reap_orphans(max_age_hours=0, dry_run=False)
          print(f"Reaped {len(orphans)} orphaned VMs")
          PY

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure'
            });
            if (issues.data.some(i => i.title.includes('Scheduled acceptance tests failed'))) {
              core.info('Issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Scheduled acceptance tests failed',
              body: [`The weekly scheduled acceptance test run failed: ${runUrl}`, '', 'Check the run log; re-run locally with TF_ACC=1 if needed.'].join('\n'),
              labels: ['ci-failure', 'bug']
            });
