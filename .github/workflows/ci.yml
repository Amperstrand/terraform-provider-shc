name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v

  generated-files-drift:
    name: sizes.go must match generator output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Clone shc-toolkit (generator source of truth)
        run: git clone --depth=1 https://github.com/Amperstrand/shc-toolkit.git ../shc-toolkit
      - name: Install toolkit deps (generator imports the package)
        run: pip install -e ../shc-toolkit -q
      - name: Regenerate sizes.go
        run: python3 ../shc-toolkit/scripts/generate_sizes.py --format go --output /tmp/sizes-regen.go
      - name: Diff committed vs generated (gofmt-normalized)
        run: |
          gofmt /tmp/sizes-regen.go > /tmp/sizes-fmt.go
          if ! diff -u provider/sizes.go /tmp/sizes-fmt.go; then
            echo "::error::provider/sizes.go differs from generator output."
            echo "Regenerate: python3 ../shc-toolkit/scripts/generate_sizes.py --format go --output provider/sizes.go && gofmt -w provider/sizes.go"
            exit 1
          fi
          echo "sizes.go matches generator output ✅"

  size-map-drift:
    name: Size map drift detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compare Go sizeMap against live catalog
        run: |
          pip install requests -q
          python3 << 'PYEOF'
          import re, sys, json, requests

          # Fetch live catalog
          api_key = __import__('os').environ.get('SHC_API_KEY_READ_ONLY', '')
          resp = requests.get('https://blesta.sovereignhybridcompute.com/user-api/v2/ordering/catalog',
              headers={'Authorization': f'Bearer {api_key}'} if api_key else {}, timeout=15)
          if resp.status_code == 401:
              print('::warning::SHC_API_KEY_READ_ONLY not set or invalid — skipping size-map drift check')
              sys.exit(0)
          raw = resp.text
          idx = raw.find('{')
          if idx > 0: raw = raw[idx:]
          catalog = json.loads(raw).get('data', raw if isinstance(raw, dict) else {})
          items = catalog.get('items', []) if isinstance(catalog, dict) else []
          live_pkgs = {}
          for pkg in items:
              pid = pkg.get('package_id')
              daily = next((p for p in pkg.get('pricing', []) if p.get('period') == 'day'), None)
              if pid and daily:
                  live_pkgs[pid] = daily['pricing_id']

          # Parse Go sizeMap
          with open('provider/sizes.go') as f:
              src = f.read()
          go_matches = re.findall(r'"([\w-]+)":\s*\{(\d+),\s*(\d+),', src)
          go_map = {name: {'pkg': int(pkg), 'pricing': int(pricing)} for name, pkg, pricing in go_matches}

          print(f'Live catalog: {len(live_pkgs)} packages')
          print(f'Go sizeMap: {len(go_map)} entries')

          errors = []
          for name, entry in go_map.items():
              pkg = entry['pkg']
              pricing = entry['pricing']
              if pkg not in live_pkgs:
                  errors.append(f'{name}: package_id {pkg} not in live catalog')
              elif live_pkgs[pkg] != pricing:
                  errors.append(f'{name}: pricing_id {pricing} != live {live_pkgs[pkg]}')

          missing = set(live_pkgs) - {e['pkg'] for e in go_map.values()}
          if missing:
              print(f'::warning::Live catalog has {len(missing)} packages not in sizeMap: {sorted(missing)}')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print('Size map matches live catalog ✅')
          PYEOF
